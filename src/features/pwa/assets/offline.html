<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#15121e" />
    <title>You're offline — Ankit</title>
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        background: #15121e;
        color: #f1ecfa;
        font: 16px/1.6 system-ui;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 420px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        color: #bdb0d0;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        background: #c5afff;
        color: #281648;
        border-radius: 6px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #c5afff;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline.</h1>
      <p>
        Reconnect to browse or edit content. Sanity needs an internet connection to load and publish
        your work.
      </p>
      <a href="/manage">Try again</a>
    </main>
  </body>
</html>
