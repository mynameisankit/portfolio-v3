<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>React JSON Renderer demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #231d30;
        color: #c5afff;
        font: 14px/1.8 monospace;
        color-scheme: dark;
      }
      body {
        padding: 12px 16px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin: 0 0 15px;
        color: #bdb0d0;
        font:
          12px/1.5 Arial,
          sans-serif;
      }
      .controls label {
        display: flex;
        gap: 5px;
        align-items: center;
        min-height: 30px;
      }
      .controls input {
        accent-color: #c5afff;
      }
      .json-lines {
        padding: 0 0 12px;
      }
      .json-line {
        display: flex;
        align-items: baseline;
        min-height: 27px;
      }
      .line-number {
        min-width: 27px;
        color: #a89ab9;
        font-size: 11px;
        user-select: none;
      }
      .line-content {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .line-content button {
        display: inline-block;
        width: 22px;
        min-height: 26px;
        padding: 0;
        background: transparent;
        border: 0;
        color: #c2afda;
        cursor: pointer;
        font: 16px monospace;
      }
      .spacer {
        display: inline-block;
        width: 22px;
      }
      .key {
        color: #f1ecfa;
      }
      .string {
        color: #c5afff;
      }
      .value {
        color: #c5afff;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #c5afff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
